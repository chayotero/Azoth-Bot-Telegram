name: XAUUSD SMC Bot

on:
  schedule:
    # Ejecución cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: 

concurrency:
  group: xauusd-smc-bot
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests ta
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Ejecutar Escáner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_scanner.py

      - name: Guardar Memoria de Señales
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          if [ -f last_signals_smc.json ]; then
            git add last_signals_smc.json
            git commit -m "Actualizar memoria SMC [Skip CI]" || exit 0
            git pull --rebase origin main || true 
            git push || exit 0
          else
            echo "No hay archivo last_signals_smc.json para guardar."
          fi