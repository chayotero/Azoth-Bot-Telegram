name: XAUUSD Algo Bot

on:
  schedule:
    # Se ejecuta cada 30 minutos (al minuto 0 y 30) para coincidir con el cierre de las velas
    - cron: '0,30 * * * *'
  workflow_dispatch: 

# Evita que dos ejecuciones choquen y corrompan la memoria
concurrency:
  group: xauusd-bot
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Ejecutar Escáner
        run: python bot_scanner.py

      - name: Guardar Memoria de Señales
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          # Solo guarda si el archivo existe
          if [ -f last_signals.json ]; then
            git add last_signals.json
            git commit -m "Actualizar memoria [Skip CI]" || exit 0
            # Sincroniza por si acaso antes de hacer push
            git pull --rebase origin main || true 
            git push || exit 0
          else
            echo "No hay archivo last_signals.json para guardar."
          fi