name: XAUUSD Algo Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Ejecutar Escáner
        run: python bot_scanner.py

      - name: Guardar Memoria de Señales
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          # Esto crea el archivo si es que no existía
          touch last_signals.json
          git add last_signals.json
          git commit -m "Actualizar memoria [Skip CI]" || exit 0
          git push
